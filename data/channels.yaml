# Seed channels. `python -m pipeline seed` resolves handles to channel ids via the Data API
# (channels.list forHandle) and derives the Shorts-only playlist id (UC... -> UUSH...).
# Unresolved handles are logged and skipped, not fatal. Edit freely; this is data, not code.
#
# level_hint: rough CEFR level of the channel's spoken German (used as the last-resort CEFR).
# topics: taxonomy ids from data/topics.yaml. dubs: channel known to publish multi-audio dubs.
# en_counterpart: handle of a channel publishing the same content in English (pair mode).
channels:
  # --- learner-oriented (A1-B1) -------------------------------------------------------
  - handle: EasyGerman
    level_hint: A2
    topics: [daily_life, culture, language_learning]
  - handle: LearnGermanwithAnja
    level_hint: A1
    topics: [language_learning]
  - handle: MrLAntrim            # Learn German with Herr Antrim
    level_hint: A1
    topics: [language_learning]
  - handle: dwdeutschlernen      # DW Deutsch lernen
    level_hint: A2
    topics: [language_learning, culture, news]
  - handle: DeutschmitRieke
    level_hint: B2
    topics: [language_learning]
  - handle: YourGermanTeacher
    level_hint: A1
    topics: [language_learning]
  - handle: goetheinstitut
    level_hint: A2
    topics: [language_learning, culture]
  - handle: ThatGermanWord       # slow German shorts
    level_hint: A1
    topics: [language_learning, daily_life]
  - handle: DeutschmitLari
    level_hint: A2
    topics: [language_learning]
  - handle: lingoni              # lingoni GERMAN
    level_hint: A1
    topics: [language_learning]

  # --- kids / explainer (simple native German) -------------------------------------------
